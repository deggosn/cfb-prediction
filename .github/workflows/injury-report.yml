name: Weekly injury report

# Runs Thursday, Friday, and Saturday mornings (11:00 UTC ≈ 6-7am ET
# depending on daylight saving) — ahead of most Saturday kickoffs, with a
# Thursday run to catch Thursday-night games too. Cron is always UTC;
# adjust the hour if you want a different local time.
on:
  schedule:
    - cron: "0 11 * * 4"  # Thursday
    - cron: "0 11 * * 5"  # Friday
    - cron: "0 11 * * 6"  # Saturday
  workflow_dispatch: {}     # lets you trigger it manually from the Actions tab to test

permissions:
  contents: write  # needed so the workflow can commit data/injuries.json back to the repo

jobs:
  fetch-injuries:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Run injury pipeline
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
        run: python scripts/fetch_injuries.py

      - name: Commit updated injury report
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Update injury report [automated]"
          file_pattern: "data/injuries.json"
